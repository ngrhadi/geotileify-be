# docker-compose.yml
version: '3.8'

services:
  geotileify:
    build:
      context: .
      dockerfile: Dockerfile
    #command: go run ./cmd/geotileify
    ports:
      - "9090:9090"
    env_file:
      - .env
    volumes:
      # --- duckdb from host ---
      - /usr/local/bin/duckdb:/usr/local/bin/duckdb:ro
      - ~/.duckdb:/root/.duckdb

      # ---tippecanoe & glibc libs from host---
      - /usr/local/bin/tippecanoe:/usr/local/bin/tippecanoe:ro
      - /lib/x86_64-linux-gnu/libz.so.1:/lib/x86_64-linux-gnu/libz.so.1:ro
      - /lib/x86_64-linux-gnu/libsqlite3.so.0:/lib/x86_64-linux-gnu/libsqlite3.so.0:ro
      - /lib/x86_64-linux-gnu/libpthread.so.0:/lib/x86_64-linux-gnu/libpthread.so.0:ro
      - /lib/x86_64-linux-gnu/libstdc++.so.6:/lib/x86_64-linux-gnu/libstdc++.so.6:ro
      - /lib/x86_64-linux-gnu/libm.so.6:/lib/x86_64-linux-gnu/libm.so.6:ro
      - /lib/x86_64-linux-gnu/libgcc_s.so.1:/lib/x86_64-linux-gnu/libgcc_s.so.1:ro
      - /lib/x86_64-linux-gnu/libc.so.6:/lib/x86_64-linux-gnu/libc.so.6:ro
      - /lib/x86_64-linux-gnu/libdl.so.2:/lib/x86_64-linux-gnu/libdl.so.2:ro
      - /lib64/ld-linux-x86-64.so.2:/lib64/ld-linux-x86-64.so.2:ro

      - ./tmp:/app/tmp
      - ./migrations:/app/migrations
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Untuk akses ke localhost dari container
    networks:
      - geotileify
      - administration_id_default
      - administration_id_adm_network

networks:
  geotileify:
  administration_id_default:  # DEFINE NETWORK EXTERNAL
    external: true
  administration_id_adm_network:  # DEFINE NETWORK EXTERNAL
    external: true
