# docker-compose.yml
version: '3.8'

services:
  geotileify:
    build:
      context: .
      dockerfile: Dockerfile
    # Runtime is linux/amd64 because the released DuckDB CLI and tylertoo
    # binary are x86_64 builds. The VPS should be Linux x86_64.
    platform: linux/amd64
    ports:
      - "9090:9090"
    env_file:
      - .env
    volumes:
      - ./tmp:/app/tmp
      - ./migrations:/app/migrations
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Untuk akses ke localhost dari container
    networks:
      - geotileify
      - administration_id_default
      - administration_id_adm_network

networks:
  geotileify:
  administration_id_default:  # DEFINE NETWORK EXTERNAL
    external: true
  administration_id_adm_network:  # DEFINE NETWORK EXTERNAL
    external: true
